spring:
  application:
    name: template-service
  datasource:
    url: jdbc:postgresql://localhost:5432/akitflow
    username: akitflow
    password: akitflow
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: template_schema
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: template_schema
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8086

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.akitflow.template: DEBUG
