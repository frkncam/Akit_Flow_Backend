# docker-compose.prod.yml — Mühür prod (Hetzner sunucu)
# Dev'den FARKLAR:
#   - build YOK → GHCR'dan hazir image cekilir (image: ghcr.io/frkncam/<modul>:latest)
#   - altyapi portlari host'a PUBLISH EDILMEZ (Docker ufw'yi deler; sadece ic ag)
#   - her serviste mem_limit (8 GB RAM'e 9 JVM sigsin; image'daki MaxRAMPercentage=75 limiti baz alir)
#   - disariya sadece gateway 127.0.0.1:8080 (nginx/06 onune gececek)
#
# Calistir:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

# --- Tum Spring servisleri icin ortak ayarlar (YAML anchor) ---
x-app-common: &app-common
  restart: unless-stopped
  environment: &app-env
    SPRING_PROFILES_ACTIVE: docker
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    # Distributed tracing → Tempo'ya OTLP. Dusuk trafik: butun istekleri ornekle (1.0).
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces

x-db-env: &db-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-akitflow}
  SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-akitflow}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

services:

  # ============ ALTYAPI ============
  postgres:
    image: postgres:16-alpine
    container_name: muhur-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-akitflow}
      POSTGRES_USER: ${DB_USERNAME:-akitflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # ports: YOK — sadece ic ag (5432 internete acilmaz)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-akitflow} -d ${DB_NAME:-akitflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 320m

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: muhur-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # ports: YOK — 5672/15672 sadece ic ag
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 320m

  minio:
    image: minio/minio:latest
    container_name: muhur-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    # ports: YOK — 9000/9001 sadece ic ag
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  minio-bootstrap:
    image: minio/mc:latest
    container_name: muhur-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb -p local/muhur-contracts || true;
      echo 'MinIO bootstrap complete';
      "

  # mailpit: prod'dan kaldirildi — notification artik gercek SMTP (Gmail) kullaniyor.
  # (Dev'de docker-compose.yml'de mailpit hala var.)

  # ============ TRACING (gozlemlenebilirlik / katman 07) ============
  # Servisler -> Tempo (OTLP 4318) -> Grafana (gorsel selale).
  # Ikisi de sadece ic ag; Grafana'ya nginx /grafana ile disaridan erisilir.
  tempo:
    image: grafana/tempo:2.6.1
    container_name: muhur-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    # ports: YOK — 3200/4318/4317 sadece ic ag
    mem_limit: 448m

  grafana:
    image: grafana/grafana:11.3.1
    container_name: muhur-grafana
    restart: unless-stopped
    depends_on:
      - tempo
    ports:
      - "127.0.0.1:3001:3000"   # sadece localhost; nginx /grafana buraya proxy yapacak
    environment:
      GF_SERVER_ROOT_URL: https://muhur.duckdns.org/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 256m

  # --- LOGS: Loki + Promtail (log toplama; traceId ile trace'e baglanir) ---
  loki:
    image: grafana/loki:3.2.1
    container_name: muhur-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    # ports: YOK — 3100 sadece ic ag
    mem_limit: 256m

  promtail:
    image: grafana/promtail:3.2.1
    container_name: muhur-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # container loglarini Docker API ile okur
      - /var/log/nginx:/var/log/nginx:ro               # nginx access log (her istek, reddedilenler dahil)
      - promtail_data:/promtail
    depends_on:
      - loki
    mem_limit: 128m

  # ============ EUREKA (servis kesfi) ============
  eureka-server:
    <<: *app-common
    image: ghcr.io/frkncam/eureka-server:latest
    container_name: muhur-eureka-server
    # ports: YOK — ic ag (8761)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 400m

  # ============ API GATEWAY (tek dis kapi) ============
  api-gateway:
    <<: *app-common
    image: ghcr.io/frkncam/api-gateway:latest
    container_name: muhur-api-gateway
    ports:
      - "127.0.0.1:8080:8080"   # sadece localhost; nginx (06) buraya proxy yapacak
    environment:
      <<: *app-env
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth:8081/oauth2/jwks
    depends_on:
      eureka-server:
        condition: service_healthy
    mem_limit: 512m

  # ============ FRONTEND (Next.js) ============
  # nginx (06) buraya proxy yapacak: / -> 127.0.0.1:3000
  # NEXT_PUBLIC_API_URL image'a build-time bos ("") gomulu -> same-origin (/api -> gateway).
  frontend:
    image: ghcr.io/frkncam/frontend:latest
    container_name: muhur-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # sadece localhost; nginx onune gececek
    mem_limit: 256m

  # ============ UYGULAMA SERVISLERI ============
  auth:
    <<: *app-common
    image: ghcr.io/frkncam/auth:latest
    container_name: muhur-auth
    environment:
      <<: [*app-env, *db-env]
      # JWT anahtarlari image'da YOK (gitignore'lu *.pem). Disaridan mount edip file: ile okutuyoruz.
      AUTH_PRIVATE_KEY_PATH: file:/keys/private.pem
      AUTH_PUBLIC_KEY_PATH: file:/keys/public.pem
      # Davet e-postasindaki link prod adresine (yoksa localhost:3000 kirik olur)
      APP_INVITE_BASE_URL: https://muhur.duckdns.org/invite/accept
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    mem_limit: 512m

  contract:
    <<: *app-common
    image: ghcr.io/frkncam/contract:latest
    container_name: muhur-contract
    environment:
      <<: [*app-env, *db-env]
      APP_MINIO_URL: http://minio:9000
      APP_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      APP_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    mem_limit: 512m

  notification:
    <<: *app-common
    image: ghcr.io/frkncam/notification:latest
    container_name: muhur-notification
    environment:
      <<: [*app-env, *db-env]
      # Gercek mail: SMTP relay (Mailpit yerine). Varsayilan Gmail SMTP.
      # Provider degistirmek icin .env.prod'da SMTP_HOST/SMTP_PORT override edilebilir.
      # Gizli kimlik bilgileri (.env.prod): SMTP_USERNAME, SMTP_PASSWORD, MAIL_FROM.
      SPRING_MAIL_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: "${SMTP_PORT:-587}"
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD}
      MAIL_SMTP_AUTH: "true"
      MAIL_SMTP_STARTTLS: "true"
      APP_MAIL_FROM: ${MAIL_FROM}
      # E-posta icindeki linkler prod adresine isaret etmeli (yoksa localhost:3000 kirik gelir)
      APP_APP_BASE_URL: https://muhur.duckdns.org
      APP_SIGN_BASE_URL: https://muhur.duckdns.org/sign
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    mem_limit: 512m

  template:
    <<: *app-common
    image: ghcr.io/frkncam/template:latest
    container_name: muhur-template
    environment:
      <<: [*app-env, *db-env]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    mem_limit: 512m

  ai:
    <<: *app-common
    image: ghcr.io/frkncam/ai-service:latest
    container_name: muhur-ai-service
    environment:
      <<: [*app-env, *db-env]
      # Groq LLM anahtari (.env.prod'tan). Yoksa container UP olur ama generate cagrilari 401 doner.
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    # NOT: 10. JVM. Deploy oncesi `free -h` ile bos RAM olc; ~600m+ varsa 512m yapilabilir.
    mem_limit: 384m

  signature:
    <<: *app-common
    image: ghcr.io/frkncam/signature:latest
    container_name: muhur-signature
    environment:
      <<: [*app-env, *db-env]
      APP_MINIO_URL: http://minio:9000
      APP_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      APP_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
    mem_limit: 512m

  workflow:
    <<: *app-common
    image: ghcr.io/frkncam/workflow:latest
    container_name: muhur-workflow
    environment:
      <<: [*app-env, *db-env]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    mem_limit: 512m

  audit:
    <<: *app-common
    image: ghcr.io/frkncam/audit:latest
    container_name: muhur-audit
    environment:
      <<: [*app-env, *db-env]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    mem_limit: 512m

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  tempo_data:
  grafana_data:
  loki_data:
  promtail_data:
