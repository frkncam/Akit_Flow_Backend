spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/akitflow
    username: akitflow
    password: akitflow
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: auth_schema
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: auth_schema

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  jwt:
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem
    access-token-expiry: 900       # 15 dakika (saniye)
    refresh-token-expiry: 2592000  # 30 gün (saniye)

app:
  invite-base-url: https://app.akitflow.com/invite/accept
  invite:
    token-validity-hours: 72
