spring:
  application:
    name: auth-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/akitflow
    username: ${DB_USERNAME:akitflow}
    password: ${DB_PASSWORD:akitflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: auth_schema
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: auth_schema
    liquibase-schema: public

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8081
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # Distributed tracing → OTLP (Tempo). Dev varsayilan localhost:4318;
  # prod'da compose env (MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4318) override eder.
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  jwt:
    private-key: ${AUTH_PRIVATE_KEY_PATH:classpath:keys/private.pem}
    public-key: ${AUTH_PUBLIC_KEY_PATH:classpath:keys/public.pem}
    access-token-expiry: 900       # 15 minutes (seconds)
    refresh-token-expiry: 2592000  # 30 days (seconds)

app:
  invite-base-url: http://localhost:3000/invite/accept
  invite:
    token-validity-hours: 72
