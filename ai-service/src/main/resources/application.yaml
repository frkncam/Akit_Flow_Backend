spring:
  application:
    name: ai-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/akitflow
    username: ${DB_USERNAME:akitflow}
    password: ${DB_PASSWORD:akitflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: ai_schema
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ai_schema
    liquibase-schema: public
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  # Spring AI — Groq (OpenAI-uyumlu endpoint)
  ai:
    openai:
      api-key: ${GROQ_API_KEY}                     # ZORUNLU env variable
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.3
          max-tokens: 8192

# Groq cagrisi icin HTTP timeout
spring.http.client:
  read-timeout: 30s
  connect-timeout: 5s

server:
  port: 8085
  shutdown: graceful

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

# Resilience4j yapilandirmasi
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      groq-api:
        base-config: default
        ignore-exceptions:
          - com.muhur.ai.exception.GenerationValidationException
          - com.muhur.ai.exception.RateLimitExceededException
  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 1s
    instances:
      groq-api:
        base-config: default
        retry-exceptions:
          - java.net.SocketTimeoutException
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException

# Uygulama ozel ayarlari
app:
  groq:
    primary-model: llama-3.3-70b-versatile
    fallback-model: llama-3.1-8b-instant
  rate-limit:
    requests-per-hour: 20
  validation:
    max-variables: 20
    min-variables: 3
    max-body-size-bytes: 102400
  prompt:
    default-key: template-generation-v1

logging:
  level:
    com.muhur.ai: DEBUG
