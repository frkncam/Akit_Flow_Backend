spring:
  application:
    name: notification-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/akitflow
    username: ${DB_USERNAME:akitflow}
    password: ${DB_PASSWORD:akitflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: notification_schema
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: notification_schema
    liquibase-schema: public

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 3
          multiplier: 2
        default-requeue-rejected: false

  mail:
    host: localhost
    port: 1025
    # Dev: Mailpit (auth/tls kapali). Prod: Brevo SMTP -> compose env ile auth/tls=true.
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

server:
  port: 8082
  shutdown: graceful

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # Distributed tracing → OTLP (Tempo). Dev varsayilan localhost:4318;
  # prod'da compose env (MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4318) override eder.
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

app:
  mail:
    from: noreply@akitflow.com
    from-name: Mühür
  app-base-url: http://localhost:3000
  sign-base-url: http://localhost:3000/sign
