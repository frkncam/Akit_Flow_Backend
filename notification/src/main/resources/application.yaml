spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/akitflow
    username: akitflow
    password: akitflow
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: notification_schema
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: notification_schema

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 3
          multiplier: 2
        default-requeue-rejected: false

  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

server:
  port: 8082

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  mail:
    from: noreply@akitflow.com
    from-name: AkitFlow
  app-base-url: https://app.akitflow.com
  sign-base-url: http://localhost:3000/sign
