<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sözleşme İmzalandı</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f5f5f5; margin:0; padding:40px 20px;">
    <div style="max-width:560px; margin:0 auto; background:#fff; border-radius:8px; padding:40px; box-shadow:0 2px 8px rgba(0,0,0,0.05);">

        <div style="margin-bottom:24px;">
            <span style="display:inline-block; background:#d1fae5; color:#065f46; padding:6px 14px; border-radius:999px; font-size:13px; font-weight:600;">İMZALANDI</span>
        </div>

        <h1 style="color:#111; margin-top:0; font-size:24px;">Sözleşme İmzalandı</h1>

        <p style="color:#444; font-size:15px; line-height:1.6;">
            <strong th:text="${contractTitle}">Sözleşme Başlığı</strong>
            başlıklı sözleşme tüm taraflarca imzalandı ve artık
            <strong>AKTİF</strong> durumda.
        </p>

        <p style="color:#444; font-size:15px; line-height:1.6;">
            <strong>İmzalayan taraflar:</strong>
        </p>
        <ul style="color:#444; font-size:14px; line-height:1.7;">
            <li th:each="email : ${signerEmails}" th:text="${email}">x@y.com</li>
        </ul>

        <p style="color:#888; font-size:13px;">
            Sözleşme ID: <span th:text="${contractId}">0</span>
        </p>

        <hr style="border:none; border-top:1px solid #eee; margin:32px 0;">

        <p style="color:#888; font-size:12px; line-height:1.5;">
            Bu mail otomatik olarak gönderilmiştir. Yanıtlamanız gerekmez.<br>
            Mühür &mdash; SaaS for Turkish Law Firms
        </p>
    </div>
</body>
</html>
