spring:
  application:
    name: signature-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/akitflow
    username: ${DB_USERNAME:akitflow}
    password: ${DB_PASSWORD:akitflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: signature_schema
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: signature_schema
    liquibase-schema: public
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8087
  shutdown: graceful

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # Distributed tracing → OTLP (Tempo). Dev varsayilan localhost:4318;
  # prod'da compose env (MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4318) override eder.
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

app:
  minio:
    url: ${APP_MINIO_URL:http://localhost:9000}
    access-key: ${APP_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${APP_MINIO_SECRET_KEY:minioadmin}
    bucket: muhur-contracts
    presigned-url-expiry-minutes: 10
  signature:
    certificate:
      validity-years: 5
      key-size: 2048
      algorithm: SHA256withRSA
    appearance:
      margin: 50
      box-width: 240
      box-height: 70
      font-size: 8
      timezone: Europe/Istanbul
      label-tr: "DIGITAL OLARAK IMZALANMISTIR"
      label-en: "DIGITALLY SIGNED"
    token:
      validity-days: 7
    otp:
      length: 6
      ttl-minutes: 5
      max-attempts: 5
      verification-window-minutes: 15
      resend-interval-seconds: 60
    tsa:
      enabled: ${SIGNATURE_TSA_ENABLED:true}
      url: ${SIGNATURE_TSA_URL:http://timestamp.digicert.com}
      timeout-seconds: 10
    consent:
      text: "Bu belgeyi okudum ve elektronik olarak imzalamayı kabul ediyorum."

logging:
  level:
    com.muhur.signature: DEBUG
