spring:
  application:
    name: signature-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/akitflow
    username: ${DB_USERNAME:akitflow}
    password: ${DB_PASSWORD:akitflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: signature_schema
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: signature_schema
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8087
  shutdown: graceful

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

app:
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: akitflow-contracts
    presigned-url-expiry-minutes: 10
  signature:
    certificate:
      validity-years: 5
      key-size: 2048
      algorithm: SHA256withRSA
    appearance:
      margin: 50
      box-width: 240
      box-height: 70
      font-size: 8
      timezone: Europe/Istanbul
      label-tr: "DIGITAL OLARAK IMZALANMISTIR"
      label-en: "DIGITALLY SIGNED"
    token:
      validity-days: 7

logging:
  level:
    com.akitflow.signature: DEBUG
