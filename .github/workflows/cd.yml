# Konum: .github/workflows/cd.yml
name: CD

on:
  push:
    branches: [main]          # SADECE main — PR'da push yok
  workflow_dispatch: {}        # elle tetik (öğrenme/rollback için)

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # GITHUB_TOKEN'a GHCR push izni ver
    strategy:
      fail-fast: false
      matrix:
        module:
          - api-gateway
          - auth
          - contract
          - notification
          - workflow
          - audit
          - template
          - signature
          - eureka-server
    name: build-push (${{ matrix.module }})
    steps:
      - uses: actions/checkout@v4

      # buildx: gelişmiş build motoru (cache + multi-platform yetenekleri)
      - uses: docker/setup-buildx-action@v3

      # GHCR'a login (ek secret yok; otomatik GITHUB_TOKEN)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag/label üret: hem :<sha> (immutable) hem :latest (default branch'te)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.module }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build + push. context = repo kökü, file = servisin Dockerfile'ı
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache: build'i hızlandır (her matrix'e ayrı scope, çakışmasın)
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,scope=${{ matrix.module }},mode=max
