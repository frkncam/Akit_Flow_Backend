# Mühür reverse proxy — path-based, tek domain (muhur.duckdns.org)
# Sunucuda konum: /etc/nginx/sites-available/akitflow  (sites-enabled'a symlink)
#
# Yonlendirme:
#   /api/             -> api-gateway (8080)   [public imza API'si /api/v1/public/sign DAHIL]
#   /actuator/health  -> api-gateway (8080)   [06 saglik kriteri]
#   /                 -> frontend Next.js (3000)  [/sign/<token> SAYFASI dahil]
#
# TLS satirlari certbot tarafindan eklendi (443 + sertifika + 80->443 yonlendirme).
# Guvenlik header'lari elle eklendi (#4). Bu dosya artik TLS dahil tam config'tir.

# Websocket upgrade (Next.js bazi ozellikleri icin) — http context'te olmali
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name muhur.duckdns.org;

    # Sozlesme/dosya yukleme icin govde limiti (gerekirse artir)
    client_max_body_size 25m;

    # --- Guvenlik header'lari (always: hata yanitlarinda da gonderilir) ---
    # HSTS: tarayici bu domaini 1 yil boyunca yalnizca HTTPS ile acsin
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # MIME-sniffing kapat
    add_header X-Content-Type-Options    "nosniff" always;
    # Clickjacking: sadece ayni origin iframe'leyebilsin
    add_header X-Frame-Options           "SAMEORIGIN" always;
    # Referrer sizintisini sinirla
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # --- Ortak proxy header'lari (backend gercek istemciyi gorsun) ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # --- Backend API (tum /api/v1/... + public imza /api/v1/public/sign) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # --- Saglik kontrolu (disariya acik tek actuator ucu) ---
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
    }

    # --- Grafana (tracing UI). Grafana sub-path'i kendi serve eder (GF_SERVER_SERVE_FROM_SUB_PATH).
    #     Kendi login'i var; anonim erisim kapali. ---
    location /grafana/ {
        proxy_pass http://127.0.0.1:3001;
    }
    location = /grafana {
        return 301 /grafana/;
    }

    # --- MinIO dosya indirme (presigned URL'ler icin) ---
    location /minio/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
    }

    # --- Frontend (her sey; imzalayanin actigi /sign/<token> SAYFASI dahil) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/muhur.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/muhur.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


server {
    if ($host = muhur.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name muhur.duckdns.org;
    return 404; # managed by Certbot
}
