# AkitFlow reverse proxy — path-based, tek domain (muhur.duckdns.org)
# Sunucuda konum: /etc/nginx/sites-available/akitflow  (sites-enabled'a symlink)
#
# Yonlendirme:
#   /api/             -> api-gateway (8080)   [public imza API'si /api/v1/public/sign DAHIL]
#   /actuator/health  -> api-gateway (8080)   [06 saglik kriteri]
#   /                 -> frontend Next.js (3000)  [/sign/<token> SAYFASI dahil]
#
# NOT: Bu dosya SADECE HTTP (80). Once boyle calistirip erisimi gorecegiz.
#      Sonra `certbot --nginx` calistirinca 443 + sertifika + 80->443 yonlendirme
#      OTOMATIK eklenir (bu dosyayi certbot kendisi duzenler).

# Websocket upgrade (Next.js bazi ozellikleri icin) — http context'te olmali
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name muhur.duckdns.org;

    # Sozlesme/dosya yukleme icin govde limiti (gerekirse artir)
    client_max_body_size 25m;

    # --- Ortak proxy header'lari (backend gercek istemciyi gorsun) ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # --- Backend API (tum /api/v1/... + public imza /api/v1/public/sign) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # --- Saglik kontrolu (disariya acik tek actuator ucu) ---
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
    }

    # --- Frontend (her sey; imzalayanin actigi /sign/<token> SAYFASI dahil) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
