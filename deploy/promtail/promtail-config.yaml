# Promtail — Docker container loglarini Docker API (socket) ile okur, Loki'ye gonderir.
# Konum (sunucu): /opt/akitflow/promtail/promtail-config.yaml -> /etc/promtail/promtail-config.yaml
# Sadece akitflow-* container'lari toplanir; 'container' label'i = container adi.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /promtail/positions.yaml   # promtail_data volume

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # sadece akitflow-* container'lari
      - source_labels: ['__meta_docker_container_name']
        regex: '/(akitflow-.*)'
        action: keep
      # container label'i = container adi (bas slash'i at)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # stdout/stderr ayrimi
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

  # nginx access log (host'ta calisir; backend'e ULASMAYAN istekler dahil HER istek).
  # Sadece prod'da var (/var/log/nginx mount'u prod compose'da); dev'de dosya yok -> sessizce atlanir.
  - job_name: nginx
    static_configs:
      - targets: ['localhost']
        labels:
          job: nginx
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      # combined format: IP - - [time] "METHOD path HTTP" status bytes "ref" "ua"
      - regex:
          expression: '^(?P<remote>\S+) \S+ \S+ \[[^\]]+\] "(?P<method>\S+) (?P<path>\S+)[^"]*" (?P<status>\d{3})'
      - labels:
          method:
          status:
